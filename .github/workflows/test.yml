# SPDX-License-Identifier: Apache-2.0
# Every test, on every push and pull request. Two third-party libraries: cbor2 for
# the wire format, and protobuf for one measurement tool. The first runs of this
# workflow are what found that the project had been describing itself as
# standard-library-only when it was not.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (cbor2; protobuf for the Q5 measurement tool)
        run: python -m pip install -r requirements-tools.txt
      - name: Every test (sdk, tools, sim, server)
        run: make test
      - name: Language packs are complete and sound
        run: make packs
