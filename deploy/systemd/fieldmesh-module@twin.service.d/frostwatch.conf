# The hoop-house twin (modules/twin) as tonight's covered-crop frost watch: one run each
# evening, started by fieldmesh-module@twin.timer, not a service that stays up. It runs
# in its own environment, because GreenLight pins numpy; make it once:
#   python3 -m venv /opt/fieldmesh/modules/twin/env
#   /opt/fieldmesh/modules/twin/env/bin/pip install -r /opt/fieldmesh/modules/twin/requirements.txt
# Its config, /etc/fieldmesh/modules/twin.json:
#   {"lat": 35.06, "lon": -86.59, "cover": "thermic", "tunnel": "<the tunnel's feature id>"}
# Everything else in fieldmesh-module@.service still holds: no network, the host's socket
# its only way out.

[Service]
Type=oneshot
Restart=no
ExecStart=
ExecStart=/opt/fieldmesh/modules/twin/env/bin/python -I /opt/fieldmesh/modules/twin/frostwatch.py \
    --socket /run/fieldmesh/modules.sock --config %d/config
# One night through GreenLight took 5 s and 132 MB here.
MemoryMax=512M
