# The notifier (modules/notify) is the one module that must reach outside the farm's
# computer: an ntfy server over HTTPS for push, and ModemManager over D-Bus for SMS.
# Everything else in fieldmesh-module@.service still holds.

[Service]
PrivateNetwork=no
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
IPAddressDeny=

# The ntfy tokens, if the server needs them: one that publishes to people's topics and
# reads the acknowledgement topic, and one that may only write that topic, since it
# rides in every message's button. A missing file falls back to a blank one: no token.
LoadCredential=ntfy-token:/etc/fieldmesh/modules/notify.ntfy-token
LoadCredential=ntfy-ack-token:/etc/fieldmesh/modules/notify.ntfy-ack-token
SetCredential=ntfy-token:\n
SetCredential=ntfy-ack-token:\n
