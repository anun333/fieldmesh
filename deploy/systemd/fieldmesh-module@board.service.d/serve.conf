# SPDX-License-Identifier: Apache-2.0
# The farm's board (modules/board): writes its pages to its own state directory and
# serves them on this machine only. To serve the farm's network, bind its address,
# give --tls-cert and --tls-key (the board refuses otherwise), and allow that network
# below.

[Service]
ExecStart=
ExecStart=/usr/bin/python3 -I /opt/fieldmesh/modules/board/board.py \
    --socket /run/fieldmesh/modules.sock --config %d/config \
    --out %S/fieldmesh-board --serve 127.0.0.1:8080
StateDirectory=fieldmesh-board
PrivateNetwork=no
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
IPAddressAllow=localhost
